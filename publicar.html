<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReadGO</title>

    <link rel="stylesheet" href="./css/styleI.css">
    <link rel="stylesheet" href="./css/styleP.css">
</head>

<body class="publicar-page">

    <header class="header">

        <a href="./index.html" class="logo">
            <ion-icon name="book-outline"></ion-icon>

            <div class="logo-texto">
                <h1>Read<span>GO</span></h1>
                <p>Tus historias, en libros.</p>
            </div>
        </a>

        <div class="busqueda">
            <ion-icon name="search-outline"></ion-icon>

            <input
                type="search"
                id="buscador"
                placeholder="Buscar libros, autores, géneros..."
            >
        </div>

        <div class="usuario">

            <button class="icono-header" aria-label="Notificaciones">
                <ion-icon name="notifications-outline"></ion-icon>
                <span class="notificacion"></span>
            </button>

            <button class="perfil" aria-label="Perfil de usuario">
                <img
                    src="https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=120&q=80"
                    alt="Avatar del usuario"
                >
            </button>

            <button class="icono-header" aria-label="Abrir perfil">
                <ion-icon name="chevron-down-outline"></ion-icon>
            </button>

        </div>

    </header>

    <main class="layout">

        <aside class="menu">

            <nav class="navegacion">

                <a href="./index.html">
                    <ion-icon name="home-outline"></ion-icon>
                    <span>Inicio</span>
                </a>

                <a href="./publicar.html" class="activo">
                    <ion-icon name="add-circle-outline"></ion-icon>
                    <span>Publicar libro</span>
                </a>

                <a href="./mis-libros.html">
                    <ion-icon name="book-outline"></ion-icon>
                    <span>Mis libros</span>
                </a>

                <a href="./index.html#estadisticas">
                    <ion-icon name="stats-chart-outline"></ion-icon>
                    <span>Estadísticas</span>
                </a>

                <a href="./index.html#configuracion">
                    <ion-icon name="settings-outline"></ion-icon>
                    <span>Configuración</span>
                </a>

            </nav>

            <div class="frase">
                <div></div>
                <p>
                    “Las grandes historias también empiezan con una idea.”
                </p>
            </div>

        </aside>

        <section class="contenido">

            <div class="publicar-layout">

                <section class="panel-portada">

                    <label for="portada" class="zona-portada" id="zonaPortada">

                        <input
                            type="file"
                            id="portada"
                            accept="image/png,image/jpeg"
                            hidden
                        >

                        <div class="contenido-portada" id="contenidoPortada">

                            <ion-icon
                                name="images-outline"
                                class="icono-imagen"
                            ></ion-icon>

                            <h2>Sube la portada de tu libro</h2>

                            <p>
                                Arrastra una imagen o haz clic para seleccionar
                            </p>

                            <small>
                                Formatos permitidos: JPG, PNG
                                <span>|</span>
                                Tamaño recomendado: 1080 × 1600 · Máximo 5 MB
                            </small>

                        </div>

                        <img
                            src=""
                            alt="Vista previa de la portada"
                            id="vistaPortada"
                            hidden
                        >

                    </label>

                </section>

                <section class="panel-formulario">

                    <div class="titulo-formulario">

                        <ion-icon name="create-outline"></ion-icon>

                        <div>
                            <h2>Publica tu libro</h2>
                            <p>Comparte tu historia con el mundo</p>
                        </div>

                    </div>

                    <form id="formularioLibro">

                        <div class="campo">

                            <label for="titulo">
                                Título del libro
                            </label>

                            <input
                                type="text"
                                id="titulo"
                                name="titulo"
                                placeholder="Escribe el título de tu libro..."
                                maxlength="120"
                                required
                            >

                        </div>

                        <div class="campo campo-descripcion">

                            <label for="descripcion">
                                Descripción
                            </label>

                            <textarea
                                id="descripcion"
                                name="descripcion"
                                placeholder="Cuéntanos de qué trata tu libro..."
                                maxlength="2000"
                                required
                            ></textarea>

                            <span class="contador" id="contador">
                                0/2000
                            </span>

                        </div>

                        <div class="campos-dobles">

                            <div class="campo">

                                <label for="categoria" class="label-icono">
                                    <ion-icon name="layers-outline"></ion-icon>
                                    Categoría
                                </label>

                                <select
                                    id="categoria"
                                    name="categoria"
                                    required
                                >
                                    <option value="" disabled selected>
                                        Selecciona una categoría
                                    </option>

                                    <option value="fantasia">Fantasía</option>
                                    <option value="romance">Romance</option>
                                    <option value="misterio">Misterio</option>
                                    <option value="aventura">Aventura</option>
                                    <option value="ciencia-ficcion">Ciencia ficción</option>
                                    <option value="terror">Terror</option>
                                    <option value="drama">Drama</option>
                                    <option value="poesia">Poesía</option>
                                    <option value="educacion">Educación</option>
                                    <option value="otros">Otros</option>
                                </select>

                            </div>

                            <div class="campo">

                                <label for="precio" class="label-icono label-precio">
                                    <ion-icon name="server-outline"></ion-icon>
                                    Precio (opcional)
                                </label>

                                <div class="entrada-precio">

                                    <input
                                        type="number"
                                        id="precio"
                                        name="precio"
                                        placeholder="Ej. 9500.00"
                                        min="0"
                                        step="0.01"
                                    >

                                    <span>COP</span>

                                </div>

                            </div>

                        </div>

                        <button type="submit" class="boton-publicar">

                            <ion-icon name="paper-plane-outline"></ion-icon>

                            <span>Publicar libro</span>

                        </button>

                        <p
                            class="mensaje"
                            id="mensaje"
                            role="status"
                            aria-live="polite"
                        ></p>

                    </form>

                </section>

            </div>

        </section>

    </main>

    <script
        type="module"
        src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js">
    </script>

    <script
        nomodule
        src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js">
    </script>

    <script src="./js/publicar.js"></script>

</body>
</html>
